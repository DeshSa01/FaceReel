# Deployment stack for the nucbox. Written to paste straight into Portainer's
# stack editor; also works with a plain `docker compose up -d`.
#
# BEFORE deploying, create the storage directory on the host and give it to
# uid 1000 (the container's user):
#
#     sudo mkdir -p /opt/facereel/storage
#     sudo chown -R 1000:1000 /opt/facereel/storage
#
# This has to happen first. If the path does not exist, Docker creates it
# owned by root and the container cannot write it -- the log then shows a
# PermissionError instead of "Cleared N orphaned job folder(s)".
#
# Override STORAGE_PATH or TZ under Portainer's "Environment variables"
# section if the defaults below don't suit.
#
# Pin to a :sha-<short> tag instead of :latest to roll back a bad build.
services:
  facereel:
    image: ghcr.io/deshsa01/facereel:latest
    container_name: facereel
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # absolute, not ./storage -- a relative path in a Portainer stack is
      # resolved on the Portainer container's filesystem, not the host's
      - ${STORAGE_PATH:-/opt/facereel/storage}:/app/storage
    environment:
      # reels are named with time.strftime(), i.e. container-local time
      TZ: ${TZ:-UTC}

# Deliberately no replicas/scaling: one runner thread in the process is the
# only consumer of the session queue and the only writer of each
# storage/sessions/<id>/session.json. A second instance would process two
# videos at once and race on those files.
