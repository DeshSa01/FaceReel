<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Supercut "cut frame" mark, full detail, for 48px and up (research D5).
       Corner brackets: the box a camera draws round a face it has found.
       Play triangle: the reel. Diagonal gap with the halves slid along it:
       the cut. mark-small.svg is the 16-32px optical size, without the gap. -->
  <defs>
    <linearGradient id="sc-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3DF5"/>
      <stop offset="1" stop-color="#E5306F"/>
    </linearGradient>
    <!-- the cut: a 3-unit gap on a 60-degree line through (33,32), as two
         half-planes; the right half is slid 1.5 units along the line -->
    <clipPath id="sc-left" clipPathUnits="userSpaceOnUse">
      <polygon points="51.70,-3.39 11.70,65.89 -22.94,45.89 17.06,-23.39"/>
    </clipPath>
    <clipPath id="sc-right" clipPathUnits="userSpaceOnUse">
      <polygon points="54.30,-1.89 14.30,67.39 48.94,87.39 88.94,18.11"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sc-g)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 22V13h9"/>
    <path d="M42 13h9v9"/>
    <path d="M51 42v9h-9"/>
    <path d="M22 51h-9v-9"/>
  </g>
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
    <polygon clip-path="url(#sc-left)" points="26,21 44,32 26,43"/>
    <g transform="translate(0.75 -1.3)">
      <polygon clip-path="url(#sc-right)" points="26,21 44,32 26,43"/>
    </g>
  </g>
</svg>
