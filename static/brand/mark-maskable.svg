<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Full-bleed, opaque variant for the Apple touch icon and Android's
       maskable icon (research D6). No corner radius: iOS and Android apply
       their own masks, and iOS fills transparency with black. The glyph is
       scaled to 80% so its outermost corner (26.9 units from the centre at
       full size) stays inside the 40%-radius safe zone. -->
  <defs>
    <linearGradient id="sc-gm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3DF5"/>
      <stop offset="1" stop-color="#E5306F"/>
    </linearGradient>
    <clipPath id="sc-left-m" clipPathUnits="userSpaceOnUse">
      <polygon points="51.70,-3.39 11.70,65.89 -22.94,45.89 17.06,-23.39"/>
    </clipPath>
    <clipPath id="sc-right-m" clipPathUnits="userSpaceOnUse">
      <polygon points="54.30,-1.89 14.30,67.39 48.94,87.39 88.94,18.11"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" fill="url(#sc-gm)"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)">
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 22V13h9"/>
      <path d="M42 13h9v9"/>
      <path d="M51 42v9h-9"/>
      <path d="M22 51h-9v-9"/>
    </g>
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
      <polygon clip-path="url(#sc-left-m)" points="26,21 44,32 26,43"/>
      <g transform="translate(0.75 -1.3)">
        <polygon clip-path="url(#sc-right-m)" points="26,21 44,32 26,43"/>
      </g>
    </g>
  </g>
</svg>
