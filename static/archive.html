<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceReel Archive</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a2130; --muted: #64748b;
    --accent: #4f46e5; --accent-2: #6366f1; --border: #e2e8f0; --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --card: #1a2130; --text: #e8ecf4; --muted: #94a3b8;
      --accent: #818cf8; --accent-2: #6366f1; --border: #2d3748; --error: #f87171;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  main { width: 100%; max-width: 900px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 8px; font-size: 0.95rem; }
  .back { color: var(--accent); font-size: 0.9rem; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .top-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 20px 0 20px;
  }
  .total { color: var(--muted); font-size: 0.9rem; }
  .empty {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 40px 24px; text-align: center; color: var(--muted);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .reel-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
  }
  .reel-card:hover { border-color: var(--accent); }
  .thumb-wrap {
    aspect-ratio: 16 / 9; background: var(--bg); display: flex;
    align-items: center; justify-content: center; overflow: hidden;
    color: var(--muted); font-size: 0.8rem; position: relative;
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .unavailable-badge {
    position: absolute; top: 6px; right: 6px; background: var(--error);
    color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;
  }
  .reel-body { padding: 10px 12px 12px; }
  .reel-title {
    font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .reel-meta { color: var(--muted); font-size: 0.78rem; margin-top: 6px; line-height: 1.4; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal {
    background: var(--card); border-radius: 12px; padding: 20px; width: 100%;
    max-width: 640px; max-height: 90vh; overflow-y: auto;
  }
  .modal video { width: 100%; border-radius: 8px; background: #000; margin-top: 10px; }
  .modal h2 { font-size: 1.1rem; margin-bottom: 4px; }
  .modal .reel-meta { font-size: 0.85rem; margin-top: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  a.dl, button.close, button.delete {
    padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: transparent;
    color: var(--text); text-decoration: none; display: inline-block;
  }
  a.dl { border-color: var(--accent); color: var(--accent); }
  button.delete { border-color: var(--error); color: var(--error); }
  button.delete:hover { background: var(--error); color: #fff; }
  .confirm {
    margin-top: 12px; padding: 12px; border-radius: 8px; border: 1px solid var(--error);
    background: var(--bg); font-size: 0.85rem;
  }
  .confirm p { margin-bottom: 10px; color: var(--text); }
  .confirm .row { display: flex; gap: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Back to generator</a>
  <h1>Archive</h1>
  <p class="sub">Every reel that has finished generating, kept until you delete it.</p>

  <div class="top-row">
    <span class="total" id="total"></span>
  </div>

  <div class="empty hidden" id="empty">No reels archived yet. Generate one from the main page.</div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="m-title"></h2>
    <p class="reel-meta" id="m-meta"></p>
    <video id="m-player" controls playsinline></video>
    <div class="modal-actions">
      <a class="dl" id="m-download">Download</a>
      <button class="close" id="m-close">Close</button>
      <button class="delete" id="m-delete-btn">Delete reel</button>
    </div>
    <div class="confirm hidden" id="m-confirm">
      <p id="m-confirm-text"></p>
      <div class="row">
        <button class="delete" id="m-confirm-yes">Yes, delete permanently</button>
        <button class="close" id="m-confirm-no">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/progress.js"></script>
<script>
const $ = id => document.getElementById(id);
let entries = [];
let current = null;

function fmtBytes(n) {
  if (n < 1024) return n + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let v = n, i = -1;
  do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
  return v.toFixed(1) + " " + units[i];
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
}
function metaLine(e) {
  const t = e.tuning || {};
  return `${e.clip_count} clip(s) · ${e.output_duration}s from a ${e.source_duration}s video` +
    ` · ${e.resolution}` + (t.zoom ? ` · ${e.zoomed_clips} zoomed` : "") +
    ` · lead-in ${t.lead_in}s, reach ${t.boundary_reach}s, gap ${t.clip_gap}s`;
}

async function load() {
  const res = await fetch("/api/archive");
  const data = await res.json();
  entries = data.entries;
  $("total").textContent = entries.length
    ? `${entries.length} reel(s) · ${fmtBytes(data.total_bytes)} total`
    : "";
  render();
  openFromHash();
}

// The completion notice in the shared bar links to /archive#<id> -- the
// archive entry id *is* the job id (research D9). hashchange, not just
// load, is what makes the link work while already on this page, which is
// exactly when it's needed most: the reel finishing while the user watches.
function openFromHash() {
  const id = location.hash.slice(1);
  if (!id) return;
  const entry = entries.find(e => e.id === id);
  if (entry) openModal(entry);
}
window.addEventListener("hashchange", openFromHash);

function render() {
  $("grid").innerHTML = "";
  $("empty").classList.toggle("hidden", entries.length > 0);
  for (const e of entries) {
    const card = document.createElement("div");
    card.className = "reel-card";
    card.innerHTML = `
      <div class="thumb-wrap">
        ${e.has_thumb ? `<img src="/api/archive/${e.id}/thumb" alt="">` : "No preview"}
        ${e.available ? "" : `<span class="unavailable-badge">unavailable</span>`}
      </div>
      <div class="reel-body">
        <div class="reel-title">${escapeHtml(e.title || "(untitled)")}</div>
        <div class="reel-meta">${fmtDate(e.created_at)}<br>${metaLine(e)}</div>
      </div>`;
    card.addEventListener("click", () => openModal(e));
    $("grid").appendChild(card);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function openModal(e) {
  current = e;
  $("m-title").textContent = e.title || "(untitled)";
  $("m-meta").textContent = `${fmtDate(e.created_at)} · ${metaLine(e)} · ${fmtBytes(e.size_bytes)}`;
  $("m-confirm").classList.add("hidden");
  if (e.available) {
    $("m-player").src = `/api/archive/${e.id}/video`;
    $("m-player").classList.remove("hidden");
    $("m-download").href = `/api/archive/${e.id}/video`;
    $("m-download").download = e.filename;
    $("m-download").classList.remove("hidden");
  } else {
    $("m-player").removeAttribute("src");
    $("m-player").classList.add("hidden");
    $("m-download").classList.add("hidden");
  }
  $("overlay").classList.remove("hidden");
}
function closeModal() {
  $("overlay").classList.add("hidden");
  $("m-player").pause();
  $("m-player").removeAttribute("src");
  current = null;
}
$("m-close").addEventListener("click", closeModal);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeModal(); });

$("m-delete-btn").addEventListener("click", () => {
  $("m-confirm-text").textContent =
    `Permanently delete "${current.title || "(untitled)"}"? This cannot be undone.`;
  $("m-confirm").classList.remove("hidden");
});
$("m-confirm-no").addEventListener("click", () => $("m-confirm").classList.add("hidden"));
$("m-confirm-yes").addEventListener("click", async () => {
  const id = current.id;
  const res = await fetch(`/api/archive/${id}`, { method: "DELETE" });
  if (!res.ok) { alert("Delete failed."); return; }
  const { freed_bytes } = await res.json();
  entries = entries.filter(e => e.id !== id);
  const totalNow = entries.reduce((sum, e) => sum + e.size_bytes, 0);
  $("total").textContent = entries.length
    ? `${entries.length} reel(s) · ${fmtBytes(totalNow)} total`
    : "";
  render();
  closeModal();
});

load();
</script>
</body>
</html>
