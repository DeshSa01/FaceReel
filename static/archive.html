<style>
  /* page layout only; every colour, size and duration is a token */
  .archive-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s-3) var(--s-5); margin-bottom: var(--s-5); }
  .archive-head .titles { flex: 1 1 320px; }
  .archive-head p { color: var(--muted); margin-top: var(--s-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s-4); }
  .reel-card { text-align: left; font: inherit; border: 1px solid var(--border); }
  .reel-card .thumb { border-bottom: 1px solid var(--border); }
  .reel-card .card-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .reel-card.is-unavailable .thumb img { opacity: .4; }
  .viewer-body { padding: var(--s-5); }
  .viewer-body h2 { font-size: var(--fs-lg); margin-bottom: var(--s-1); overflow-wrap: anywhere; }
  .viewer-meta { color: var(--muted); font-size: var(--fs-sm); }
  .viewer-close { position: absolute; top: var(--s-3); right: var(--s-3); z-index: 2; background: var(--scrim); color: var(--on-media); }
  .viewer-close:hover:not(:disabled) { background: var(--scrim); color: var(--on-media); opacity: .85; }
  .viewer-unavailable { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--on-media); opacity: .7; font-size: var(--fs-sm); }
  .m-from { margin-top: var(--s-3); font-size: var(--fs-sm); }
  .m-videos { margin-top: var(--s-4); }
  .m-group + .m-group { margin-top: var(--s-4); }
  .m-group li { display: flex; gap: var(--s-2); align-items: baseline; padding: var(--s-2) 0; font-size: var(--fs-sm); }
  .m-mark { flex: none; }
  .m-mark.ok { color: var(--success); }
  .m-mark.no { color: var(--danger); }
  .m-body { flex: 1; min-width: 0; }
  .m-name { overflow-wrap: anywhere; }
  .m-reason { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; }
  .viewer-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-5); }
  .viewer-actions .spacer { flex: 1; }
  .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; background: var(--scrim); color: var(--on-media); }
  .viewer-nav:hover:not(:disabled) { background: var(--scrim); color: var(--on-media); opacity: .85; }
  .viewer-prev { left: var(--s-3); }
  .viewer-next { right: var(--s-3); }
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; margin-bottom: var(--s-5); }
  .toolbar .search { flex: 1 1 260px; max-width: 420px; }
  .toolbar .search .btn { position: absolute; right: 4px; }
  .toolbar .search .input { padding-right: 40px; }
  .archive-head .meter { width: 260px; }
  @media (max-width: 600px) { .archive-head .meter { width: 100%; } .toolbar .search { max-width: none; } }
  .reel-card .thumb video { position: absolute; inset: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .reel-card.is-leaving { opacity: 0; transform: scale(.94); transition: opacity var(--t-med), transform var(--t-med) var(--ease-out); }
  }
  .result-count { margin-left: auto; }
</style>

<script src="/static/js/shell.js"></script>
<script src="/static/progress.js"></script>
<script src="/static/js/player.js"></script>
<script>
const $ = id => document.getElementById(id);
const { el, badge, icon, fmtBytes, fmtDate } = Supercut;

let entries = [];
let totalBytes = 0;
let disk = { total: null, free: null };
let current = null;
let clipStrip = null;   // the open reel's clip strip (FR-042)

for (let i = 0; i < 8; i++) {
  const c = el("div", "card card-media");
  c.appendChild(el("div", "skeleton skeleton-thumb"));
  const b = el("div", "card-body");
  b.appendChild(el("div", "skeleton skeleton-text"));
  const t2 = el("div", "skeleton skeleton-text"); t2.style.width = "60%";
  b.appendChild(t2);
  c.appendChild(b);
  $("skeleton").appendChild(c);
}

function metaLine(e) {
  if (e.kind === "session") {
    const joined = (e.videos || []).filter(v => v.state === "joined").length;
    return `${joined} video(s) joined · ${e.clip_count} clip(s) · ${e.output_duration}s · ${e.resolution}`;
  }
  const t = e.tuning || {};
  return `${e.clip_count} clip(s) · ${e.output_duration}s from a ${e.source_duration}s video` +
    ` · ${e.resolution}` + (t.zoom ? ` · ${e.zoomed_clips} zoomed` : "") +
    ` · lead-in ${t.lead_in}s, reach ${t.boundary_reach}s, gap ${t.clip_gap}s`;
}

/* ---- view state: search (not kept) + kind and sort (kept; FR-036) -------- */

const VIEW_KEY = "supercut.archive";
const KINDS = ["all", "session", "video"];
const SORTS = { newest: "Newest", oldest: "Oldest", longest: "Longest", largest: "Largest" };
const view = { q: "", kind: "all", sort: "newest" };
try {
  const saved = JSON.parse(Supercut.store(VIEW_KEY) || "{}");
  // an unknown value from an older version, or a hand edit, falls back
  if (KINDS.includes(saved.kind)) view.kind = saved.kind;
  if (saved.sort in SORTS) view.sort = saved.sort;
} catch { /* defaults */ }
function saveView() { Supercut.store(VIEW_KEY, JSON.stringify({ kind: view.kind, sort: view.sort })); }

// The one derivation of what's shown, used by the grid and by the viewer's
// previous/next, so stepping follows exactly what's on screen (FR-038).
function visible() {
  const q = view.q.trim().toLowerCase();
  const list = entries.filter(e =>
    (view.kind === "all" || (view.kind === "session" ? e.kind === "session" : e.kind !== "session")) &&
    (!q || (e.title || "").toLowerCase().includes(q)));
  const by = {
    newest: (a, b) => b.created_at.localeCompare(a.created_at),
    oldest: (a, b) => a.created_at.localeCompare(b.created_at),
    longest: (a, b) => (b.output_duration || 0) - (a.output_duration || 0),
    largest: (a, b) => (b.size_bytes || 0) - (a.size_bytes || 0),
  }[view.sort];
  return list.sort(by);
}

function syncToolbar() {
  $("q").value = view.q;
  $("q-clear").hidden = !view.q;
  for (const btn of document.querySelectorAll("[data-kind]")) btn.setAttribute("aria-pressed", String(btn.dataset.kind === view.kind));
  for (const item of document.querySelectorAll("[data-sort]")) item.setAttribute("aria-checked", String(item.dataset.sort === view.sort));
  $("sort-label").textContent = SORTS[view.sort];
}
$("q").addEventListener("input", () => { view.q = $("q").value; $("q-clear").hidden = !view.q; render(); });
$("q-clear").addEventListener("click", () => { view.q = ""; syncToolbar(); render(); $("q").focus(); });
for (const btn of document.querySelectorAll("[data-kind]")) {
  btn.addEventListener("click", () => { view.kind = btn.dataset.kind; saveView(); syncToolbar(); render(); });
}
$("sort-menu").addEventListener("toggle", e => {
  if (e.newState !== "open") return;
  const r = $("sort-btn").getBoundingClientRect();
  Object.assign($("sort-menu").style, { top: `${r.bottom + 6}px`, left: `${Math.min(r.left, innerWidth - 196)}px`, right: "auto" });
  ($("sort-menu").querySelector('[aria-checked="true"]') || $("sort-menu").querySelector(".menu-item")).focus();
});
for (const item of document.querySelectorAll("[data-sort]")) {
  item.addEventListener("click", () => {
    view.sort = item.dataset.sort; saveView(); syncToolbar(); render();
    $("sort-menu").hidePopover(); $("sort-btn").focus();
  });
}
$("sort-menu").addEventListener("keydown", e => {
  const items = [...$("sort-menu").querySelectorAll(".menu-item")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
  }
});

/* ---- storage meter (FR-039) ------------------------------------------ */

// Free space under 10% (chosen) turns the meter amber: the archive only
// grows, and nothing deletes reels but the user.
const LOW_FREE = 0.10;
function showMeter() {
  $("meter").hidden = false;
  $("meter-main").innerHTML = "";
  $("meter-main").append(el("strong", null, Supercut.plural(entries.length, "reel")), ` · ${fmtBytes(totalBytes)}`);
  if (disk.total && disk.free != null) {
    const used = disk.total - disk.free;
    $("meter-free").textContent = `${fmtBytes(disk.free)} free`;
    $("meter-fill").style.width = `${Math.max(0.5, 100 * totalBytes / disk.total)}%`;
    $("meter-other").style.width = `${Math.max(0, 100 * (used - totalBytes) / disk.total)}%`;
    $("meter").classList.toggle("is-warning", disk.free / disk.total < LOW_FREE);
    $("meter").title = `Archive ${fmtBytes(totalBytes)} · other files ${fmtBytes(Math.max(0, used - totalBytes))} · free ${fmtBytes(disk.free)} of ${fmtBytes(disk.total)}`;
  } else {
    // the server couldn't read the drive: show the archive's size alone
    $("meter-free").textContent = "";
    $("meter-fill").style.width = "0";
    $("meter-other").style.width = "0";
  }
}

async function load() {
  try {
    const res = await fetch("/api/archive");
    if (!res.ok) throw new Error();
    const data = await res.json();
    entries = data.entries;
    totalBytes = data.total_bytes;
    disk = { total: data.disk_total_bytes, free: data.disk_free_bytes };
  } catch {
    $("skeleton").hidden = true;
    Supercut.toast("Couldn't load the archive.", { kind: "error", action: { label: "Retry", onClick: load } });
    return;
  }
  $("skeleton").hidden = true;
  showMeter();
  syncToolbar();
  render();
  openFromHash();
}

// The completion notice in the shared bar links to /archive#<id> -- the
// archive entry id *is* the job id (research D9). hashchange, not just
// load, is what makes the link work while already on this page, which is
// exactly when it's needed most: the reel finishing while the user watches.
function openFromHash() {
  const id = location.hash.slice(1);
  if (!id) return;
  const entry = entries.find(e => e.id === id);
  if (entry) openModal(entry);
}
window.addEventListener("hashchange", openFromHash);

/* ---- hover and focus previews (FR-037) ------------------------------- */

// The reel itself, muted, from its start -- not a generated preview clip,
// which would add encoding work on a host where encoding is already the
// bottleneck (spec assumption). 250 ms before starting (chosen) so sweeping
// the pointer across the grid doesn't start a fetch per card; only the first
// 6 s loop (chosen), which bounds the bytes fetched per hover.
const PREVIEW_DELAY_MS = 250, PREVIEW_LOOP_S = 6;
const canPreview = () => matchMedia("(hover: hover)").matches &&
  matchMedia("(prefers-reduced-motion: no-preference)").matches;
function attachPreview(card, e) {
  if (!e.available) return;
  let timer = null, vid = null;
  const start = () => {
    if (!canPreview() || vid) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      vid = document.createElement("video");
      Object.assign(vid, { muted: true, playsInline: true, preload: "auto" });
      vid.setAttribute("aria-hidden", "true");
      vid.src = `/api/archive/${e.id}/video?v=${encodeURIComponent(e.created_at)}`;
      vid.addEventListener("timeupdate", () => { if (vid && vid.currentTime >= PREVIEW_LOOP_S) vid.currentTime = 0; });
      vid.addEventListener("ended", () => { if (vid) { vid.currentTime = 0; vid.play().catch(() => {}); } });
      card.querySelector(".thumb").appendChild(vid);
      vid.play().catch(() => {});
    }, PREVIEW_DELAY_MS);
  };
  const stop = () => {
    clearTimeout(timer);
    if (!vid) return;
    // dropping src releases the connection; without it the browser keeps
    // buffering a video nobody is watching
    vid.pause(); vid.removeAttribute("src"); vid.load(); vid.remove(); vid = null;
  };
  card.addEventListener("pointerenter", start);
  card.addEventListener("pointerleave", stop);
  card.addEventListener("focusin", start);
  card.addEventListener("focusout", stop);
  card.addEventListener("click", stop);
}

function reelCard(e) {
  const card = el("button", "card card-media card-interactive reel-card" + (e.available ? "" : " is-unavailable"));
  card.type = "button";
  card.dataset.id = e.id;
  const thumb = el("div", "thumb" + (e.has_thumb ? "" : " is-placeholder"));
  if (e.has_thumb) {
    const img = el("img");
    img.src = `/api/archive/${e.id}/thumb`;
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    thumb.appendChild(img);
  }
  const badges = el("div", "thumb-badges");
  if (e.kind === "session") badges.appendChild(badge("session", "Session"));
  if (!e.available) badges.appendChild(badge("failed", "Unavailable"));
  if (badges.childNodes.length) thumb.appendChild(badges);
  thumb.appendChild(el("span", "thumb-chip", Supercut.fmtDuration(e.output_duration)));
  card.appendChild(thumb);
  const body = el("div", "card-body");
  body.appendChild(el("div", "card-title", e.title || "(untitled)"));
  card.title = e.title || "";
  card.setAttribute("aria-label", `${e.title || "Untitled"}, ${Supercut.fmtDuration(e.output_duration)}`);
  body.appendChild(el("div", "card-meta", `${Supercut.fmtShortDate(e.created_at)} · ${fmtBytes(e.size_bytes)}`));
  card.appendChild(body);
  card.addEventListener("click", () => openModal(e));
  attachPreview(card, e);
  return card;
}

function clearFilters() {
  view.q = ""; view.kind = "all"; saveView(); syncToolbar(); render(); $("q").focus();
}

function render() {
  const none = entries.length === 0;
  const shown = visible();
  $("toolbar").hidden = none;
  $("empty").replaceChildren();
  $("empty").hidden = shown.length > 0;
  if (none) {
    $("empty").appendChild(Supercut.emptyState({
      art: "archive", title: "No reels yet",
      body: "Every reel you make lands here, and stays until you delete it.",
      action: { label: "Go to Sessions", href: "/", icon: "layers" },
    }));
  } else if (!shown.length) {
    // US6 scenario 7, and a remembered filter that now matches nothing
    $("empty").appendChild(Supercut.emptyState({
      art: "search", title: "Nothing matches",
      body: view.q ? `No reel's title contains “${view.q.trim()}”.` : "No reels of this kind yet.",
      action: { label: "Clear filters", icon: "x", onClick: clearFilters },
    }));
  }
  const filtered = view.q || view.kind !== "all";
  $("result-count").textContent = filtered && !none ? `${shown.length} of ${entries.length}` : "";
  $("grid").replaceChildren(...shown.map(reelCard));
}

// "youtube.com/watch?v=ID" rather than the whole link, for videos whose
// title was never fetched because they failed before download
function shortUrl(u) {
  try {
    const x = new URL(u), id = x.searchParams.get("v");
    return id ? `youtube.com/watch?v=${id}` : x.host + x.pathname;
  } catch { return u || ""; }
}

function videoGroup(parent, heading, items, ok) {
  if (!items.length) return;
  const group = el("div", "m-group");
  group.appendChild(el("h3", "section-title", `${heading} (${items.length})`));
  const ul = el("ul", "list");
  for (const v of items) {
    const li = el("li");
    const mark = el("span", `m-mark ${ok ? "ok" : "no"}`);
    mark.appendChild(icon(ok ? "check" : "x", "icon-sm"));
    const body = el("span", "m-body");
    const name = el(v.url ? "a" : "span", "m-name", v.title || shortUrl(v.url));
    if (v.url) { name.href = v.url; name.target = "_blank"; name.rel = "noopener"; }
    body.appendChild(name);
    if (!ok && v.reason) body.appendChild(el("span", "m-reason", v.reason));
    li.append(mark, body);
    ul.appendChild(li);
  }
  group.appendChild(ul);
  parent.appendChild(group);
}

function openModal(e) {
  current = e;
  $("m-title").textContent = e.title || "(untitled)";
  $("m-meta").textContent = `${fmtDate(e.created_at)} · ${metaLine(e)} · ${fmtBytes(e.size_bytes)}`;
  const list = visible(), at = list.findIndex(x => x.id === e.id);
  $("m-pos").textContent = at >= 0 && list.length > 1 ? `${at + 1} of ${list.length} · ← → to step through` : "";
  $("m-prev").disabled = at <= 0;
  $("m-next").disabled = at < 0 || at >= list.length - 1;
  // a session reel lists what went into it, including what didn't make it;
  // a single reel made inside a session links back to that session
  const vids = $("m-videos"), from = $("m-from");
  vids.replaceChildren();
  vids.hidden = e.kind !== "session";
  if (e.kind === "session") {
    const all = e.videos || [];
    videoGroup(vids, "Joined", all.filter(v => v.state === "joined"), true);
    videoGroup(vids, "Not included", all.filter(v => v.state !== "joined"), false);
  }
  // Retrying reopens the session and rebuilds this reel once the retried
  // videos finish; the session page is where that progress shows.
  const failed = e.kind === "session" ? (e.videos || []).filter(v => v.state === "failed").length : 0;
  $("m-retry").hidden = !failed;
  $("m-retry").disabled = false;
  $("m-retry").textContent = `Retry ${failed} failed video${failed === 1 ? "" : "s"}`;
  $("m-retry-msg").hidden = true;
  from.replaceChildren();
  from.hidden = !e.session_id;
  if (e.session_id) {
    const a = el("a", null, `From session ${e.session_id.slice(0, 6)}…`);
    a.href = `/session/${e.session_id}`;
    from.appendChild(a);
  }
  if (clipStrip) { clipStrip.destroy(); clipStrip = null; }
  if (e.available) {
    clipStrip = SupercutPlayer.attach($("m-player"), e);
    $("m-player").src = `/api/archive/${e.id}/video?v=${encodeURIComponent(e.created_at)}`;
    $("m-player").hidden = false;
    $("m-unavailable").hidden = true;
    $("m-download").href = `/api/archive/${e.id}/video`;
    $("m-download").download = e.filename;
    $("m-download").hidden = false;
  } else {
    $("m-player").removeAttribute("src");
    $("m-player").hidden = true;
    $("m-unavailable").hidden = false;
    $("m-download").hidden = true;
  }
  // the address names the open reel, so it can be shared or reloaded
  // (replaceState: stepping through twenty reels isn't twenty Back presses)
  if (location.hash.slice(1) !== e.id) history.replaceState(null, "", `#${e.id}`);
  if (!$("viewer").open) $("viewer").showModal();
}
function step(delta) {
  if (!current) return;
  const list = visible(), at = list.findIndex(x => x.id === current.id), next = list[at + delta];
  if (next) openModal(next);
}
$("m-prev").addEventListener("click", () => step(-1));
$("m-next").addEventListener("click", () => step(1));
// ← → step through the current filtered, sorted order (no wrap-around);
// Escape is native to <dialog>. Not while a control that uses arrows (the
// video's own seek bar) has focus.
$("viewer").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (document.activeElement === $("m-player")) return;
  e.preventDefault();
  step(e.key === "ArrowLeft" ? -1 : 1);
});
function closeModal() {
  if ($("viewer").open) $("viewer").close();
}
// one teardown however the dialog closes (button, Escape, backdrop)
$("viewer").addEventListener("close", () => {
  if (clipStrip) { clipStrip.destroy(); clipStrip = null; }
  $("m-player").pause();
  $("m-player").removeAttribute("src");
  $("m-player").load();
  const id = current && current.id;
  current = null;
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  // focus returns to the card the viewer was showing
  const card = id && document.querySelector(`.reel-card[data-id="${id}"]`);
  if (card) card.focus({ preventScroll: false });
});
$("m-close").addEventListener("click", closeModal);
// a click on the backdrop lands on the dialog element itself
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) closeModal(); });

$("m-retry").addEventListener("click", async () => {
  const id = current.id;
  $("m-retry").disabled = true;
  const res = await fetch(`/api/sessions/${id}/retry`, { method: "POST" });
  if (res.ok) { location.href = `/session/${id}`; return; }
  $("m-retry-msg").textContent = (await res.json()).detail || "Could not retry.";
  $("m-retry-msg").hidden = false;
  $("m-retry").disabled = false;
});

$("m-delete-btn").addEventListener("click", () => {
  $("m-confirm-text").textContent =
    `“${current.title || "(untitled)"}” will be permanently deleted. This cannot be undone.`;
  $("confirm").showModal();
  $("m-confirm-no").focus();
});
$("m-confirm-no").addEventListener("click", () => $("confirm").close());
// Explicit click handlers rather than <form method="dialog"> plus a "close"
// listener: with the viewer dialog stacked underneath, Chrome was seen to
// close the confirmation without ever dispatching "close" once the viewer had
// earlier been dismissed with Escape, so the delete silently never ran.
$("m-confirm-yes").addEventListener("click", async () => {
  $("confirm").close();
  if (!current) return;
  const target = current;
  // where the viewer goes next, decided before the list changes
  const list = visible(), at = list.findIndex(x => x.id === target.id);
  const after = list[at + 1] || list[at - 1] || null;
  const card = document.querySelector(`.reel-card[data-id="${target.id}"]`);
  if (card) card.style.opacity = ".5";
  let res;
  try { res = await fetch(`/api/archive/${target.id}`, { method: "DELETE" }); } catch { res = null; }
  if (!res || !res.ok) {
    if (card) card.style.opacity = "";
    Supercut.toast(`Couldn't delete “${target.title || "(untitled)"}”.`, { kind: "error" });
    return;
  }
  const { freed_bytes } = await res.json();
  entries = entries.filter(e => e.id !== target.id);
  totalBytes = Math.max(0, totalBytes - freed_bytes);
  if (disk.free != null) disk.free += freed_bytes;
  showMeter();
  Supercut.toast(`Deleted “${target.title || "(untitled)"}” · freed ${fmtBytes(freed_bytes)}`, { kind: "success" });
  // the viewer advances to the next reel, or closes when there isn't one
  if (after) openModal(after); else closeModal();
  const finish = () => render();
  if (card && matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    card.style.opacity = "";
    card.classList.add("is-leaving");
    card.addEventListener("transitionend", finish, { once: true });
    setTimeout(finish, 400);   // in case transitionend never fires
  } else finish();
});

load();
</script>
</body>
</html>
