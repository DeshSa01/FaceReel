name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # hardcoded lowercase: GHCR rejects uppercase, and github.repository is
  # "DeshSa01/FaceReel". Must stay in step with docker-compose.yml.
  IMAGE_NAME: deshsa01/facereel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough for GHCR with packages:write -- no PAT needed
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha- tags give a rollback target; latest is what compose pulls
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          # the nucbox is x86_64; add ,linux/arm64 here if that ever changes
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: the GHA cache backend intermittently fails the
          # export with "not_found" *after* the image has already been pushed,
          # which would otherwise redden a build that actually succeeded
          cache-to: type=gha,mode=max,ignore-error=true
